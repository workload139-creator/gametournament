{% extends "base.html" %}

{% block content %}

<h2>Leaderboard</h2>

<table class="table table-dark">

<tr>
<th>Team</th>
<th>Kills</th>
<th>Placement</th>
<th>Points</th>
</tr>

{% for r in results %}

<tr>

<td>{{ r.team }}</td>
<td>{{ r.kills }}</td>
<td>{{ r.placement }}</td>
<td>{{ r.points }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
