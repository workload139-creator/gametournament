
{% extends "base.html" %}

{% block content %}

<div class="auth-card">

<h2>Login</h2>

<form method="POST">

{% csrf_token %}

<input class="form-control mb-3" name="username" placeholder="Username">

<input type="password" class="form-control mb-3" name="password" placeholder="Password">

<button class="btn btn-warning w-100">
Login
</button>

</form>

<hr>

<a href="/accounts/otp/" class="btn btn-outline-warning w-100">

Login with OTP

</a>

</div>

{% endblock %}
