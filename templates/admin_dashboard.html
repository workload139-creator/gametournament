{% extends "base.html" %}
{% load static %}

{% block content %}

<h2>Admin Dashboard</h2>

<div class="row">

<div class="col-md-3">

<div class="gaming-card p-4 text-center">

<h3>{{total_players}}</h3>

Players

</div>

</div>

<div class="col-md-3">

<div class="gaming-card p-4 text-center">

<h3>{{total_tournaments}}</h3>

Tournaments

</div>

</div>

<div class="col-md-3">

<div class="gaming-card p-4 text-center">

<h3>₹{{revenue}}</h3>

Revenue

</div>

</div>

<div class="col-md-3">

<div class="gaming-card p-4 text-center">

<h3>₹{{payout}}</h3>

Payout

</div>

</div>

</div>

<hr>

<div class="gaming-card p-4">

<h3>Upload Match Result</h3>

<input
type="file"
id="csvFile"
class="form-control mb-3">

<button
class="btn btn-warning"
onclick="uploadCSV()">

Upload CSV

</button>

</div>

<script src="{% static 'js/csv_upload.js' %}"></script>

{% endblock %}
