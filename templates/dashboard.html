
{% extends "base.html" %}
{% load static %}

{% block content %}

<h2 class="text-white mb-4">

Welcome {{request.user.username}}

</h2>

<div class="row">

<div class="col-md-4 mb-3">

<div class="gaming-card p-4">

<h5>Free Fire UID</h5>

<h3>{{request.user.ff_uid}}</h3>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="gaming-card p-4">

<h5>Wallet</h5>

<h3>₹{{request.user.wallet}}</h3>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="gaming-card p-4">

<h5>Status</h5>

<h3 class="text-success">Verified</h3>

</div>

</div>

</div>

<div class="gaming-card p-4 mt-4">

<h4>Quick Actions</h4>

<div class="row mt-3">

<div class="col-md-3 mb-2">

<a href="/teams/create/" class="btn btn-warning w-100">

Create Team

</a>

</div>

<div class="col-md-3 mb-2">

<a href="/leaderboard/" class="btn btn-primary w-100">

Leaderboard

</a>

</div>

<div class="col-md-3 mb-2">

<a href="/wallet/" class="btn btn-success w-100">

Wallet

</a>

</div>

<div class="col-md-3 mb-2">

<a href="/accounts/logout/" class="btn btn-danger w-100">

Logout

</a>

</div>

</div>

</div>

{% endblock %}
