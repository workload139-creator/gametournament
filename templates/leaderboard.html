
{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">🏆 Live Leaderboard</h2>

<div class="gaming-card p-4">

<table class="table table-dark">

<tr>

<th>Rank</th>
<th>Player</th>
<th>Kills</th>
<th>Placement</th>
<th>Reward</th>

</tr>

{% for r in results %}

<tr>

<td>{{forloop.counter}}</td>

<td>{{r.player.username}}</td>

<td>{{r.kills}}</td>

<td>#{{r.placement}}</td>

<td>₹{{r.reward}}</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
